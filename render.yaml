# Render's free persistent database is PostgreSQL, and it expires 30 days after creation.
# A MySQL service on Render needs a paid persistent disk, so this blueprint uses the free Postgres plan.
# The local application continues to use MySQL. Database passwords and APP_KEY are supplied by Render, not this file.

services:
  - type: web
    name: campus-events
    runtime: docker
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Campus Events
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: campus-events-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_CHANNEL
        value: stderr
      - key: FILESYSTEM_DISK
        value: public
      - key: APP_URL
        fromService:
          type: web
          name: campus-events
          envVarKey: RENDER_EXTERNAL_URL
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: INITIAL_ADMIN_NAME
        value: Campus Administrator

databases:
  - name: campus-events-db
    plan: free
    region: oregon
    databaseName: campus_events
    ipAllowList: []
